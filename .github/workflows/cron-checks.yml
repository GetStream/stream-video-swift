name: Cron Checks

on:
  schedule:
    # Runs "At 01:00 every night except weekends"
    - cron: '0 1 * * 1-5'

  workflow_dispatch:
    inputs:
      verbose:
        description: 'Run tests in verbose mode?'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1 # Disable cleanup for homebrew, we don't need it on CI
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}

jobs:
  build-test-app-and-frameworks:
    name: Build Test App and Frameworks
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/ruby-cache
    - uses: ./.github/actions/xcode-cache
    - name: Build
      run: bundle exec fastlane build_test_app_and_frameworks ${{ env.VERBOSE }}
      timeout-minutes: 60
    - uses: actions/upload-artifact@v7.0.1
      if: success()
      with:
        name: cache-derived-data
        path: |
          derived_data/Build/**/*.app
          derived_data/Build/**/*.xctestrun
          derived_data/Build/**/*.framework

  test-e2e-debug:
    name: Test E2E UI (Debug)
    needs: build-test-app-and-frameworks
    strategy:
      matrix:
        include:
          - ios: "26.2"
            device: "iPhone 17 Pro"
            setup_runtime: false
          - ios: "18.5"
            device: "iPhone 16 Pro"
            setup_runtime: false
          - ios: "17.5"
            device: "iPhone 15 Pro"
            setup_runtime: true
      fail-fast: false
    runs-on: macos-15
    env:
      GITHUB_EVENT: ${{ toJson(github.event) }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      XCODE_VERSION: "26.1.1"
      IOS_SIMULATOR_DEVICE: "${{ matrix.device }} (${{ matrix.ios }})"
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/download-artifact@v8.0.1
      with:
        name: cache-derived-data
        path: derived_data/Build/
    - uses: ./.github/actions/bootstrap
      env:
        INSTALL_ALLURE: true
        INSTALL_VIDEO_BUDDY: true
        INSTALL_YEETD: true
        INSTALL_IPSW: true
        SKIP_SWIFT_BOOTSTRAP: true
    - uses: ./.github/actions/setup-ios-runtime
      if: ${{ matrix.setup_runtime }}
      timeout-minutes: 60
      with:
        version: ${{ matrix.ios }}
        device: ${{ matrix.device }}
    - name: Launch Allure TestOps
      run: bundle exec fastlane allure_launch cron:true
    - name: Run UI Tests (Debug)
      run: bundle exec fastlane test_e2e device:"${{ env.IOS_SIMULATOR_DEVICE }}" cron:true test_without_building:true ${{ env.VERBOSE }}
      timeout-minutes: 90
      env:
        STREAM_SDK_TEST_APP: ${{ secrets.STREAM_SDK_TEST_APP }}
        STREAM_SDK_TEST_ACCOUNT_EMAIL: ${{ secrets.STREAM_SDK_TEST_ACCOUNT_EMAIL }}
        STREAM_SDK_TEST_ACCOUNT_PASSWORD: ${{ secrets.STREAM_SDK_TEST_ACCOUNT_PASSWORD }}
        STREAM_SDK_TEST_ACCOUNT_OTP_SECRET: ${{ secrets.STREAM_SDK_TEST_ACCOUNT_OTP_SECRET }}
    - name: Allure TestOps Upload
      if: success() || failure()
      run: bundle exec fastlane allure_upload launch_id:$LAUNCH_ID
    - name: Allure TestOps Launch Removal
      if: cancelled()
      run: bundle exec fastlane allure_launch_removal launch_id:$LAUNCH_ID
    - name: Upload xcresults for every attempt
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test Results E2E (iOS ${{ matrix.ios }})
        include-hidden-files: true
        path: |
          fastlane/test_output/DemoApp-attempts-*/
          fastlane/test_output/DemoApp.xcresult/
          fastlane/test_output/report.junit
          ~/Library/Logs/scan/*.log
    - name: Parse all DemoApp xcresults
      if: always()
      run: |
        brew install chargepoint/xcparse/xcparse
        bash Scripts/parse_test_xcresults.sh DemoApp
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: Test Data E2E (iOS ${{ matrix.ios }})
        if-no-files-found: ignore
        path: |
          fastlane/recordings
          fastlane/*.log
          fastlane/test_output/report.junit
          fastlane/test_output/logs/

  build-and-test-debug-attempts:
    name: Test LLC attempts (iOS ${{ matrix.ios }})
    strategy:
      matrix:
        include:
          - ios: "26.2"
            device: "iPhone 17 Pro"
            setup_runtime: false
          - ios: "18.5"
            device: "iPhone 16 Pro"
            setup_runtime: false
          - ios: "17.5"
            device: "iPhone 15 Pro"
            setup_runtime: true
          - ios: "16.4"
            device: "iPhone 14 Pro"
            setup_runtime: true
      fail-fast: false
    runs-on: macos-15
    continue-on-error: true
    env:
      XCODE_VERSION: "26.2"
      IOS_SIMULATOR_DEVICE: "${{ matrix.device }} (${{ matrix.ios }})"
    steps:
    - uses: actions/checkout@v7.0.1
      id: llc_checkout
    - uses: ./.github/actions/bootstrap
      id: llc_bootstrap
      env:
        INSTALL_YEETD: true
        INSTALL_IPSW: true
    - uses: ./.github/actions/setup-ios-runtime
      id: llc_runtime
      if: ${{ matrix.setup_runtime }}
      timeout-minutes: 60
      with:
        version: ${{ matrix.ios }}
        device: ${{ matrix.device }}
    - name: Run LLC Tests (Debug)
      id: llc_initial
      run: bundle exec fastlane test device:"${{ env.IOS_SIMULATOR_DEVICE }}" cron:true retries:0 ${{ env.VERBOSE }}
      timeout-minutes: 60
    - name: Retry LLC Tests (1/3)
      id: llc_retry_1
      if: ${{ !cancelled() && steps.llc_initial.outcome == 'failure' }}
      run: bundle exec fastlane test device:"${{ env.IOS_SIMULATOR_DEVICE }}" cron:true retries:0 retry_failed:true skip_build:true ${{ env.VERBOSE }}
      timeout-minutes: 60
    - name: Retry LLC Tests (2/3)
      id: llc_retry_2
      if: ${{ !cancelled() && steps.llc_retry_1.outcome == 'failure' }}
      run: bundle exec fastlane test device:"${{ env.IOS_SIMULATOR_DEVICE }}" cron:true retries:0 retry_failed:true skip_build:true ${{ env.VERBOSE }}
      timeout-minutes: 60
    - name: Retry LLC Tests (3/3)
      id: llc_retry_3
      if: ${{ !cancelled() && steps.llc_retry_2.outcome == 'failure' }}
      run: bundle exec fastlane test device:"${{ env.IOS_SIMULATOR_DEVICE }}" cron:true retries:0 retry_failed:true skip_build:true ${{ env.VERBOSE }}
      timeout-minutes: 60
    - name: Determine LLC attempt result
      id: llc_attempt_result
      if: always()
      run: |
        if [[ "${{ steps.llc_initial.outcome }}" == success ||
              "${{ steps.llc_retry_1.outcome }}" == success ||
              "${{ steps.llc_retry_2.outcome }}" == success ||
              "${{ steps.llc_retry_3.outcome }}" == success ]]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Upload xcresults for every attempt
      id: llc_results
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test Results LLC (iOS ${{ matrix.ios }})
        include-hidden-files: true
        path: |
          fastlane/test_output/StreamVideo-attempts-*/
          fastlane/test_output/StreamVideo.xcresult/
          fastlane/test_output/report.junit
          ~/Library/Logs/scan/*.log
    - name: Parse all StreamVideo xcresults
      id: llc_parse
      if: always()
      run: |
        brew install chargepoint/xcparse/xcparse
        bash Scripts/parse_test_xcresults.sh StreamVideo
    - uses: actions/upload-artifact@v7.0.1
      id: llc_data
      if: always()
      with:
        name: Test Data LLC (iOS ${{ matrix.ios }})
        if-no-files-found: ignore
        path: |
          fastlane/test_output/logs/
    - name: Record LLC result
      if: always()
      run: |
        if [[ "${{ steps.llc_checkout.outcome }}" == success &&
              "${{ steps.llc_bootstrap.outcome }}" == success &&
              ( "${{ matrix.setup_runtime }}" == false ||
                "${{ steps.llc_runtime.outcome }}" == success ) &&
              "${{ steps.llc_attempt_result.outputs.passed }}" == true &&
              "${{ steps.llc_results.outcome }}" == success &&
              "${{ steps.llc_parse.outcome }}" == success &&
              "${{ steps.llc_data.outcome }}" == success ]]; then
          printf 'pass\n' > "$RUNNER_TEMP/llc-result-ios-${{ matrix.ios }}.txt"
        else
          printf 'failure\n' > "$RUNNER_TEMP/llc-result-ios-${{ matrix.ios }}.txt"
        fi
    - name: Upload LLC result
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: llc-result-${{ github.run_id }}-${{ github.run_attempt }}-ios-${{ matrix.ios }}
        path: ${{ runner.temp }}/llc-result-ios-${{ matrix.ios }}.txt
        if-no-files-found: error

  build-and-test-debug:
    name: Test LLC (Debug)
    runs-on: ubuntu-latest
    needs: build-and-test-debug-attempts
    if: ${{ !cancelled() }}
    steps:
    - uses: actions/download-artifact@v8.0.1
      with:
        pattern: llc-result-${{ github.run_id }}-${{ github.run_attempt }}-ios-*
        path: llc-results
        merge-multiple: true
    - name: Verify LLC results
      run: |
        for ios in 26.2 18.5 17.5 16.4; do
          result="llc-results/llc-result-ios-${ios}.txt"
          if [[ ! -f "$result" || "$(cat "$result")" != pass ]]; then
            echo "LLC tests or required report steps failed for iOS ${ios}" >&2
            exit 1
          fi
        done

  build-apps:
    name: Build Demo Apps
    runs-on: macos-15
    needs: build-test-app-and-frameworks
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/download-artifact@v8.0.1
      with:
        name: cache-derived-data
        path: derived_data/Build/
    - uses: ./.github/actions/ruby-cache
    - uses: ./.github/actions/xcode-cache
    - name: Build SwiftUI Demo App
      run: bundle exec fastlane build_swiftui_demo ${{ env.VERBOSE }}
    - name: Build UIKit Demo App
      run: bundle exec fastlane build_uikit_demo ${{ env.VERBOSE }}
    - name: Build Docs Test Project
      run: bundle exec fastlane build_docs_test ${{ env.VERBOSE }}

  build-old-xcode:
    name: Build SDKs (Old Xcode)
    runs-on: macos-15
    if: ${{ github.event_name != 'push' && github.event.inputs.snapshots != 'true' }}
    env:
      XCODE_VERSION: "16.4"
    steps:
    - name: Connect Bot
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/xcode-cache
    - uses: ./.github/actions/ruby-cache
    - name: List Xcode versions
      run: mdfind "kMDItemCFBundleIdentifier = 'com.apple.dt.Xcode'"
    - name: Build LLC
      run: bundle exec fastlane test device:"iPhone 15" build_for_testing:true ${{ env.VERBOSE }}
      timeout-minutes: 25
    - name: Build SwiftUI
      run: bundle exec fastlane test_swiftui device:"iPhone 15" build_for_testing:true ${{ env.VERBOSE }}
    - name: Build UIKit
      run: bundle exec fastlane test_uikit device:"iPhone 15" build_for_testing:true ${{ env.VERBOSE }}
      timeout-minutes: 25

  automated-code-review:
    name: Automated Code Review
    runs-on: macos-15
    env:
      XCODE_VERSION: "16.4"
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/bootstrap
    - run: bundle exec fastlane rubocop
    - run: bundle exec fastlane run_swift_format strict:true

  slack:
    name: Slack Report
    runs-on: ubuntu-latest
    needs: [build-and-test-debug, test-e2e-debug, build-test-app-and-frameworks, build-apps, build-old-xcode, automated-code-review]
    if: >-
      ${{
        !cancelled() && github.event_name == 'schedule' &&
        (needs.build-and-test-debug.result == 'failure' ||
         needs.test-e2e-debug.result == 'failure' ||
         needs.build-test-app-and-frameworks.result == 'failure' ||
         needs.build-apps.result == 'failure' ||
         needs.build-old-xcode.result == 'failure' ||
         needs.automated-code-review.result == 'failure')
      }}
    steps:
      - uses: 8398a7/action-slack@v3
        with:
          status: cancelled
          text: "You shall not pass!"
          job_name: "${{ github.workflow }}: ${{ github.job }}"
          fields: repo,commit,author,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_NIGHTLY_CHECKS }}
