name: Test Flight Deploy DemoApp

on:
  pull_request:
    branches:
      - 'main'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: macos-15
    env:
      MATCH_GIT_TOKEN: ${{ steps.bot-token.outputs.token }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PR_NUM: ${{ github.event.number }}
    steps:
    - uses: actions/checkout@v4.1.1
    - name: Generate bot token
      id: bot-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
        private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ios-certificates
        permission-contents: read
    - uses: ./.github/actions/ruby-cache
    - uses: ./.github/actions/xcode-cache
    - if: ${{ github.event.inputs.release }} == 'Debug'
      run: brew install imagemagick
    - run: bundle exec fastlane swiftui_testflight_build configuration:"${{ github.event.inputs.release || (github.event_name == 'pull_request' && 'Debug') || (github.event_name == 'release' && 'Release') }}"
      timeout-minutes: 40
    - uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "You shall not pass!"
        fields: repo,commit,author,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_IOS_BOTS }}
      if: failure()
