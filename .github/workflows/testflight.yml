name: Test Flight Deploy DemoApp

on:
  pull_request:
    branches:
      - 'main'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: macos-15
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PR_NUM: ${{ github.event.number }}
    steps:
    - name: Connect Bot
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}
    - uses: actions/checkout@v7
    - uses: ./.github/actions/ruby-cache
    - uses: ./.github/actions/xcode-cache
    - if: ${{ github.event.inputs.release == 'Debug' }}
      run: brew install imagemagick
    - run: bundle exec fastlane swiftui_testflight_build configuration:"${{ github.event.inputs.release || (github.event_name == 'pull_request' && 'Debug') || (github.event_name == 'release' && 'Release') }}"
      timeout-minutes: 40
    - uses: slackapi/slack-github-action@v4
      if: failure()
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        errors: true
        payload: |
          text: ${{ toJSON('You shall not pass!') }}
          attachments:
            - color: danger
              title: ${{ toJSON(format('{0}: {1} ({2})', github.workflow, github.job, job.status)) }}
              text: ${{ toJSON(format('Repository: {0} | Commit: {1} | Actor: {2}', github.repository, github.sha, github.actor)) }}
              footer: ${{ toJSON(format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id)) }}
