name: Smoke Checks

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '**/*.png'

  workflow_dispatch:
    inputs:
      record_snapshots_swiftui:
        description: 'Record SwiftUI snapshots on CI?'
        type: boolean
        required: false
        default: false
      record_snapshots_uikit:
        description: 'Record UIKit snapshots on CI?'
        type: boolean
        required: false
        default: false
      verbose:
        description: 'Run tests in verbose mode?'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1 # Disable cleanup for homebrew, we don't need it on CI
  IOS_SIMULATOR_DEVICE: "iPhone 17 Pro (26.2)"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
  VERBOSE: ${{ github.event.inputs.verbose == 'true' && '--verbose' || '' }}

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/ci-guard
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  test-llc-debug:
    name: Test LLC (Debug)
    runs-on: macos-15
    needs: guard
    if: ${{ github.event.inputs.record_snapshots_swiftui != 'true' && github.event.inputs.record_snapshots_uikit != 'true' }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - uses: ./.github/actions/bootstrap
      env:
        INSTALL_YEETD: true
        INSTALL_SONAR: true
    - name: Run LLC Tests (Debug)
      id: llc_initial
      continue-on-error: true
      run: bundle exec fastlane test device:"${{ env.IOS_SIMULATOR_DEVICE }}" retries:0 ${{ env.VERBOSE }}
      timeout-minutes: 40
    - name: Retry LLC Tests (1/3)
      id: llc_retry_1
      if: ${{ !cancelled() && steps.llc_initial.outcome == 'failure' }}
      continue-on-error: true
      run: bundle exec fastlane test device:"${{ env.IOS_SIMULATOR_DEVICE }}" retries:0 retry_failed:true skip_build:true ${{ env.VERBOSE }}
      timeout-minutes: 40
    - name: Retry LLC Tests (2/3)
      id: llc_retry_2
      if: ${{ !cancelled() && steps.llc_retry_1.outcome == 'failure' }}
      continue-on-error: true
      run: bundle exec fastlane test device:"${{ env.IOS_SIMULATOR_DEVICE }}" retries:0 retry_failed:true skip_build:true ${{ env.VERBOSE }}
      timeout-minutes: 40
    - name: Retry LLC Tests (3/3)
      id: llc_retry_3
      if: ${{ !cancelled() && steps.llc_retry_2.outcome == 'failure' }}
      run: bundle exec fastlane test device:"${{ env.IOS_SIMULATOR_DEVICE }}" retries:0 retry_failed:true skip_build:true ${{ env.VERBOSE }}
      timeout-minutes: 40
    - name: Run Sonar analysis
      run: bundle exec fastlane sonar_upload
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    - uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "You shall not pass!"
        job_name: "Test LLC (Debug)"
        fields: repo,commit,author,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: ${{ github.event_name == 'push' && failure() }}
    - name: Upload xcresults for every attempt
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test Results LLC
        include-hidden-files: true
        path: |
          fastlane/test_output/StreamVideo-attempts-*/
          fastlane/test_output/StreamVideo.xcresult/
          fastlane/test_output/report.junit
          ~/Library/Logs/scan/*.log
    - name: Parse all StreamVideo xcresults
      if: always()
      run: |
        brew install chargepoint/xcparse/xcparse
        bash Scripts/parse_test_xcresults.sh StreamVideo
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: Test Data LLC
        if-no-files-found: ignore
        path: |
          fastlane/test_output/logs/
    - name: Upload Test Coverage
      uses: actions/upload-artifact@v7.0.1
      with:
        name: test-coverage-${{ github.event.pull_request.number }}
        path: reports/sonarqube-generic-coverage.xml

  test-swiftui-debug:
    name: Test SwiftUI (Debug)
    runs-on: macos-15
    needs: guard
    if: ${{ github.event.inputs.record_snapshots_uikit != 'true' || github.event.inputs.record_snapshots_swiftui == 'true' }}
    permissions:
      contents: write # to push the snapshots branch
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.CI_BOT_GITHUB_TOKEN }} # to open a PR
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/bootstrap
      env:
        INSTALL_YEETD: true
        SKIP_SWIFT_BOOTSTRAP: true
    - name: Run UI Tests (Debug)
      run: bundle exec fastlane test_swiftui device:"${{ env.IOS_SIMULATOR_DEVICE }}" record:"${{ github.event.inputs.record_snapshots_swiftui }}" ${{ env.VERBOSE }}
      timeout-minutes: 120
    - name: Parse xcresult
      if: failure()
      run: |
        brew install chargepoint/xcparse/xcparse
        xcparse screenshots fastlane/test_output/StreamVideoSwiftUI.xcresult fastlane/test_output/snapshots --test
    - uses: actions/upload-artifact@v7.0.1
      if: failure()
      with:
        name: SwiftUI Test Data
        path: fastlane/test_output/snapshots

  test-uikit-debug:
    name: Test UIKit (Debug)
    runs-on: macos-15
    needs: guard
    if: ${{ github.event.inputs.record_snapshots_swiftui != 'true' || github.event.inputs.record_snapshots_uikit == 'true' }}
    permissions:
      contents: write # to push the snapshots branch
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.CI_BOT_GITHUB_TOKEN }} # to open a PR
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/bootstrap
      env:
        INSTALL_YEETD: true
        SKIP_SWIFT_BOOTSTRAP: true
    - name: Run UI Tests (Debug)
      run: bundle exec fastlane test_uikit device:"${{ env.IOS_SIMULATOR_DEVICE }}" record:"${{ github.event.inputs.record_snapshots_uikit }}" ${{ env.VERBOSE }}
      timeout-minutes: 120
    - name: Parse xcresult
      if: failure()
      run: |
        brew install chargepoint/xcparse/xcparse
        xcparse screenshots fastlane/test_output/StreamVideoUIKit.xcresult fastlane/test_output/snapshots --test
    - uses: actions/upload-artifact@v7.0.1
      if: failure()
      with:
        name: UIKit Test Data
        path: fastlane/test_output/snapshots

  automated-code-review:
    name: Automated Code Review
    runs-on: macos-15
    needs: guard
    env:
      XCODE_VERSION: "16.4"
    if: ${{ github.event.inputs.record_snapshots_swiftui != 'true' && github.event.inputs.record_snapshots_uikit != 'true' }}
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/bootstrap
      env:
        INSTALL_INTERFACE_ANALYZER: true
    - run: bundle exec fastlane lint_pr
    - run: bundle exec fastlane rubocop
    - run: bundle exec fastlane run_swift_format strict:true
    - run: bundle exec fastlane validate_public_interface
      if: startsWith(github.event.pull_request.head.ref, 'release/')

  build-old-xcode:
    name: Build SDKs (Old Xcode)
    runs-on: macos-15
    needs:
      - guard
      - test-llc-debug
    if: ${{ github.event.inputs.record_snapshots_swiftui != 'true' && github.event.inputs.record_snapshots_uikit != 'true' }}
    env:
      XCODE_VERSION: "16.4"
    steps:
    - name: Connect Bot
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/xcode-cache
    - uses: ./.github/actions/ruby-cache
    - name: List Xcode versions
      run: mdfind "kMDItemCFBundleIdentifier = 'com.apple.dt.Xcode'"
    - name: Build LLC
      run: bundle exec fastlane test device:"iPhone 16" build_for_testing:true ${{ env.VERBOSE }}
      timeout-minutes: 25
    - name: Build SwiftUI
      run: bundle exec fastlane test_swiftui device:"iPhone 16" build_for_testing:true ${{ env.VERBOSE }}
    - name: Build UIKit
      run: bundle exec fastlane test_uikit device:"iPhone 16" build_for_testing:true ${{ env.VERBOSE }}
      timeout-minutes: 25

  build-test-app-and-frameworks:
    name: Build Test App and Frameworks
    runs-on: macos-15
    needs:
      - guard
      - test-llc-debug
    if: ${{ github.event.inputs.record_snapshots_swiftui != 'true' && github.event.inputs.record_snapshots_uikit != 'true' }}
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/ruby-cache
    - uses: ./.github/actions/xcode-cache
    - name: Build
      run: bundle exec fastlane build_test_app_and_frameworks ${{ env.VERBOSE }}
      timeout-minutes: 60
    - uses: actions/upload-artifact@v7.0.1
      if: success()
      with:
        name: cache-derived-data
        path: |
          derived_data/Build/**/*.app
          derived_data/Build/**/*.xctestrun
          derived_data/Build/**/*.framework

  build-apps:
    name: Build Demo Apps
    runs-on: macos-15
    needs:
      - guard
      - build-test-app-and-frameworks
    if: ${{ github.event.inputs.record_snapshots_swiftui != 'true' && github.event.inputs.record_snapshots_uikit != 'true' }}
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/download-artifact@v8.0.1
      with:
        name: cache-derived-data
        path: derived_data/Build/
    - uses: ./.github/actions/ruby-cache
    - uses: ./.github/actions/xcode-cache
    - name: Build SwiftUI Demo App
      run: bundle exec fastlane build_swiftui_demo ${{ env.VERBOSE }}
    - name: Build UIKit Demo App
      run: bundle exec fastlane build_uikit_demo ${{ env.VERBOSE }}
    - name: Build Docs Test Project
      run: bundle exec fastlane build_docs_test ${{ env.VERBOSE }}

  allure_testops_launch:
    name: Launch Allure TestOps
    runs-on: macos-15
    needs:
      - guard
      - build-test-app-and-frameworks
    if: ${{ github.event.inputs.record_snapshots_swiftui != 'true' && github.event.inputs.record_snapshots_uikit != 'true' }}
    outputs:
      launch_id: ${{ steps.get_launch_id.outputs.launch_id }}
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/ruby-cache
    - name: Launch Allure TestOps
      run: bundle exec fastlane allure_launch
      env:
        ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        GITHUB_EVENT: ${{ toJson(github.event) }}
    - id: get_launch_id
      run: echo "launch_id=${{env.LAUNCH_ID}}" >> $GITHUB_OUTPUT
      if: env.LAUNCH_ID != ''

  test-e2e-debug:
    name: Test E2E UI (Debug)
    runs-on: macos-15
    if: ${{ github.event.inputs.record_snapshots_swiftui != 'true' && github.event.inputs.record_snapshots_uikit != 'true' }}
    needs:
      - guard
      - allure_testops_launch
      - build-test-app-and-frameworks
    env:
      LAUNCH_ID: ${{ needs.allure_testops_launch.outputs.launch_id }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
    strategy:
      matrix:
        batch: [0]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/download-artifact@v8.0.1
      with:
        name: cache-derived-data
        path: derived_data/Build/
    - uses: ./.github/actions/bootstrap
      env:
        INSTALL_ALLURE: true
        INSTALL_VIDEO_BUDDY: true
        INSTALL_YEETD: true
        SKIP_SWIFT_BOOTSTRAP: true
    - name: Run UI Tests (Debug)
      run: bundle exec fastlane test_e2e device:"${{ env.IOS_SIMULATOR_DEVICE }}" batch:'${{ matrix.batch }}' test_without_building:true ${{ env.VERBOSE }}
      timeout-minutes: 60
      env:
        MATRIX_SIZE: ${{ strategy.job-total }}
        STREAM_SDK_TEST_APP: ${{ secrets.STREAM_SDK_TEST_APP }}
        STREAM_SDK_TEST_ACCOUNT_EMAIL: ${{ secrets.STREAM_SDK_TEST_ACCOUNT_EMAIL }}
        STREAM_SDK_TEST_ACCOUNT_PASSWORD: ${{ secrets.STREAM_SDK_TEST_ACCOUNT_PASSWORD }}
        STREAM_SDK_TEST_ACCOUNT_OTP_SECRET: ${{ secrets.STREAM_SDK_TEST_ACCOUNT_OTP_SECRET }}
    - name: Allure TestOps Upload
      if: env.LAUNCH_ID != '' && (success() || failure())
      run: bundle exec fastlane allure_upload launch_id:$LAUNCH_ID
    - name: Allure TestOps Launch Removal
      if: env.LAUNCH_ID != '' && cancelled()
      run: bundle exec fastlane allure_launch_removal launch_id:$LAUNCH_ID
    - name: Upload xcresults for every attempt
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test Results E2E ${{ matrix.batch }}
        include-hidden-files: true
        path: |
          fastlane/test_output/DemoApp-attempts-*/
          fastlane/test_output/DemoApp.xcresult/
          fastlane/test_output/report.junit
          ~/Library/Logs/scan/*.log
    - name: Parse all DemoApp xcresults
      if: always()
      run: |
        brew install chargepoint/xcparse/xcparse
        bash Scripts/parse_test_xcresults.sh DemoApp
    - uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: E2E Test Data ${{ matrix.batch }}
        if-no-files-found: ignore
        path: |
          fastlane/recordings
          fastlane/*.log
          fastlane/test_output/report.junit
          fastlane/test_output/logs/
