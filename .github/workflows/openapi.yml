name: OpenAPI

on:
  workflow_dispatch:
    inputs:
      protocol_ref:
        description: 'GetStream/protocol branch name or commit hash'
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4.1.1
      with:
        persist-credentials: false
    - uses: actions/checkout@v4.1.1
      with:
        repository: GetStream/protocol
        ref: ${{ inputs.protocol_ref }}
        path: protocol
        persist-credentials: false
    - name: Install SwiftFormat
      run: |
        source ./Githubfile
        wget "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFT_FORMAT_VERSION}/swiftformat_linux.zip" -O /tmp/swiftformat_linux.zip
        unzip -o /tmp/swiftformat_linux.zip -d /tmp/swiftformat
        sudo mv /tmp/swiftformat/swiftformat_linux /usr/local/bin/swiftformat
        sudo chmod +x /usr/local/bin/swiftformat
        swiftformat --version
    - name: Generate OpenAPI models
      # The spec is the protocol checkout above. generate-client still needs
      # chat's openapi binary. Set OPENAPI to that binary on the runner.
      run: bash Scripts/generate.sh
      timeout-minutes: 30
      env:
        PROTOCOL_DIR: ${{ github.workspace }}/protocol
    - uses: actions/upload-artifact@v4
      with:
        name: openapi-generated
        path: Sources/StreamVideo/OpenApi/generated
        if-no-files-found: error
    - uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "You shall not pass!"
        job_name: "${{ github.workflow }}: ${{ github.job }}"
        fields: repo,commit,author,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: failure()

  pull-request:
    name: Pull request
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4.1.1
      with:
        token: ${{ secrets.CI_BOT_GITHUB_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: openapi-generated
        path: Sources/StreamVideo/OpenApi/generated
    - uses: ./.github/actions/ruby-cache
    - name: Open pull request
      run: bundle exec fastlane openapi
      env:
        GITHUB_TOKEN: ${{ secrets.CI_BOT_GITHUB_TOKEN }}
    - uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "You shall not pass!"
        job_name: "${{ github.workflow }}: ${{ github.job }}"
        fields: repo,commit,author,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: failure()
