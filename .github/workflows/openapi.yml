name: OpenAPI

on:
  workflow_dispatch:
    inputs:
      protocol_ref:
        description: 'GetStream/protocol branch name or commit hash'
        required: false
        default: main
        type: string
      generator_release:
        description: 'GetStream/chat release tag for openapi-linux-amd64. Empty uses the latest release.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4.1.1
      with:
        persist-credentials: false
    - uses: actions/checkout@v4.1.1
      with:
        repository: GetStream/protocol
        ref: ${{ inputs.protocol_ref }}
        path: protocol
        persist-credentials: false
    - name: Install SwiftFormat
      run: |
        source ./Githubfile
        wget "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFT_FORMAT_VERSION}/swiftformat_linux.zip" -O /tmp/swiftformat_linux.zip
        unzip -o /tmp/swiftformat_linux.zip -d /tmp/swiftformat
        sudo mv /tmp/swiftformat/swiftformat_linux /usr/local/bin/swiftformat
        sudo chmod +x /usr/local/bin/swiftformat
        swiftformat --version
    - name: Create chat read token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.CI_GO_MODULES_CLIENT_ID }}
        private-key: ${{ secrets.CI_GO_MODULES_PRIVATE_KEY }}
        owner: GetStream
        repositories: chat
        permission-contents: read
    - name: Download OpenAPI generator
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GENERATOR_RELEASE: ${{ inputs.generator_release }}
      run: |
        bin="${RUNNER_TEMP}/openapi"
        mkdir -p "$bin"
        if [ -n "${GENERATOR_RELEASE}" ]; then
          gh release download "$GENERATOR_RELEASE" \
            --repo GetStream/chat \
            --pattern 'openapi-linux-amd64*' \
            --dir "$bin"
        else
          gh release download \
            --repo GetStream/chat \
            --pattern 'openapi-linux-amd64*' \
            --dir "$bin"
        fi
        (cd "$bin" && sha256sum -c openapi-linux-amd64.sha256)
        chmod +x "$bin/openapi-linux-amd64"
        echo "OPENAPI=${bin}/openapi-linux-amd64" >> "$GITHUB_ENV"
    - name: Generate OpenAPI models
      run: bash Scripts/generate.sh
      timeout-minutes: 30
      env:
        PROTOCOL_DIR: ${{ github.workspace }}/protocol
    - uses: actions/upload-artifact@v4
      with:
        name: openapi-generated
        path: Sources/StreamVideo/OpenApi/generated
        if-no-files-found: error
    - uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "You shall not pass!"
        job_name: "${{ github.workflow }}: ${{ github.job }}"
        fields: repo,commit,author,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_IOS_BOTS }}
      if: failure()

  pull-request:
    name: Pull request
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Generate release bot token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
        private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
    - uses: actions/checkout@v4.1.1
      with:
        token: ${{ steps.app-token.outputs.token }}
    - uses: actions/download-artifact@v4
      with:
        name: openapi-generated
        path: Sources/StreamVideo/OpenApi/generated
    - name: Open pull request
      run: bash Scripts/openapi_open_pull_request.sh
      env:
        # Checkout and git push use this token through the git credential.
        # gh reads GH_TOKEN. The script unsets it for the push.
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
    - uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "You shall not pass!"
        job_name: "${{ github.workflow }}: ${{ github.job }}"
        fields: repo,commit,author,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_IOS_BOTS }}
      if: failure()
